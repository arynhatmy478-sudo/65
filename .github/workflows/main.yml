name: Build Android APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download repository
    uses: actions/checkout@v4

  - name: Extract project ZIP
    run: |
      sudo apt-get update
      sudo apt-get install -y unzip
      mkdir -p project
      ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
      if [ -z "$ZIP_FILE" ]; then
        echo "Project ZIP not found"
        exit 1
      fi
      unzip -o "$ZIP_FILE" -d project
      find project -maxdepth 4 -type f | head -100

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build APK
    run: |
      GRADLE_FILE=$(find project -type f -name gradlew | head -n 1)
      if [ -z "$GRADLE_FILE" ]; then
        echo "Gradle wrapper not found in ZIP"
        exit 1
      fi
      PROJECT_DIR=$(dirname "$GRADLE_FILE")
      cd "$PROJECT_DIR"
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: jangal-focus-apk
      path: project/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
